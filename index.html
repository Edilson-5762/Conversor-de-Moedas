<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Convert Money</title>
</head>

<body>
    <a href="https://porfifolio-theta.vercel.app/"
        style="position:fixed;top:14px;right:14px;z-index:9999;background:rgba(0,0,0,0.6);color:#fff;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-family:Arial,sans-serif;">←
        Voltar ao Portfólio</a>
    <img class="logo" src="./assets/logo.gif" alt="logo.gif">

    <main>
        <label>
            Convert <b>de</b>
            <select>
                <option>R$ Real brasileiro</option>
            </select>
        </label>


        <label>
            Convert <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro</option>
            </select>
        </label>

        <label>

            Valor
            <input class="input-currency" placeholder="R$ 10.000.00">
            <button class="convert-button">Converter</button>
        </label>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="/assets/arrow.png" alt="seta">

            <div class="currency-box">
                <img class="currency-img" src="./assets/dolar.png" alt="logo-moeda-a-convertida">
                <p class="currency" id="currency-name">Dólar americano</p>
                <p class="currency-value">US$ 0.0</p>
            </div>

        </section>

    </main>

</body>
<script src="./scripts.js"></script>


</html>
